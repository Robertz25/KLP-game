<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KLP Arena | Controller</title><style>body{margin:0;min-height:100vh;touch-action:none;background:#e8f1ea;color:#18302c;font-family:Arial}.wrap{width:min(420px,90%);min-height:100vh;margin:auto;padding:24px 0;display:flex;flex-direction:column}.controller{display:none;flex:1;flex-direction:column;justify-content:space-between}.joystick{width:250px;height:250px;border-radius:50%;background:#c6dfcc;position:relative;margin:30px auto}.stick{width:35%;aspect-ratio:1;border-radius:50%;background:#1f7a59;position:absolute;left:32.5%;top:32.5%}.bomb{width:100%;padding:24px;background:#e86f51;color:#fff;border:0;border-radius:4px;font-size:22px}.contact{display:none;flex-direction:column;gap:10px}.contact input{padding:14px}.message{text-align:center;color:#60726d}.button{padding:14px;background:#18302c;color:#fff;border:0;border-radius:4px}</style></head><body><main class="wrap"><h1>KLP Arena</h1><section id="join"><input id="room" placeholder="ROOM CODE"><button class="button" id="joinButton">Join room</button></section><section class="controller" id="controller"><div class="message" id="message"></div><input id="nameEditor" placeholder="Your name"><button class="button" id="saveName">Save name</button><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="message" id="death">You are out</div><form class="contact" id="contact"><input name="firstName" required placeholder="First name"><input name="lastName" required placeholder="Last name"><input name="email" required type="email" placeholder="Email"><input name="phone" required type="tel" placeholder="Phone number"><button class="button">Send details</button></form><button class="bomb" id="bomb">DROP BOMB</button></section></main><script>(()=>{const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),room=new URLSearchParams(location.search).get('room')||'',join=document.querySelector('#join'),controller=document.querySelector('#controller'),joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick'),bomb=document.querySelector('#bomb'),message=document.querySelector('#message'),name=document.querySelector('#nameEditor'),death=document.querySelector('#death'),contact=document.querySelector('#contact');let active=false,vector={x:0,y:0};const send=(type,data={})=>{if(ws.readyState===1)ws.send(JSON.stringify({type,...data}))};function stop(){active=false;vector={x:0,y:0};stick.style.transform='';send('input',{input:vector})}function move(e){e.preventDefault();const r=joystick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.32,l=Math.min(m,Math.hypot(x,y)),a=Math.atan2(y,x);vector={x:Math.cos(a)*l/m,y:Math.sin(a)*l/m};stick.style.transform=`translate(${Math.cos(a)*l}px,${Math.sin(a)*l}px)`;send('input',{input:vector})}joystick.onpointerdown=e=>{active=true;joystick.setPointerCapture(e.pointerId);move(e)};joystick.onpointermove=e=>{if(active)move(e)};joystick.onpointerup=stop;window.onpointerup=stop;bomb.style.display='none';document.querySelector('#joinButton').onclick=()=>send('join',{room:document.querySelector('#room').value.trim().toUpperCase(),name:'Guest'});document.querySelector('#saveName').onclick=()=>send('rename',{name:name.value.trim()});bomb.onpointerdown=e=>{e.preventDefault();send('input',{input:{bomb:true}})};ws.onopen=()=>{if(room){document.querySelector('#room').value=room.toUpperCase();send('join',{room,name:'Guest'})}};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){join.style.display='none';controller.style.display='flex';message.textContent='Waiting for the host to start'}if(m.type==='start'){bomb.style.display='block';message.textContent='Game started'}if(m.type==='player-dead'){joystick.style.display='none';bomb.style.display='none';name.style.display='none';document.querySelector('#saveName').style.display='none';death.style.display='block';contact.style.display='flex'}if(m.type==='restart'){joystick.style.display='block';bomb.style.display='block';name.style.display='block';document.querySelector('#saveName').style.display='block';death.style.display='none';contact.style.display='none';message.textContent='New round'}}})();</script></body></html>
