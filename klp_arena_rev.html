<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiskekampen | Ta territorium</title>
  <style>
    :root { --ink:#18302c; --muted:#60726d; --panel:#fffdf8; --green:#1f7a59; --mint:#dcefe2; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 10% 0%, #dcefe2 0 18%, transparent 42%),linear-gradient(135deg,#f6f1e7,#e8f1ea 62%,#d4e6dc);font-family:Georgia,serif}
    .shell{width:min(1420px,100%);margin:auto;padding:24px 28px}
    .masthead{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px;margin-left:10px}
    .eyebrow{font:700 11px/1.2 Arial, sans-serif;letter-spacing:.16em;color:var(--green);text-transform:uppercase}
    h1{margin:3px 0 0;font-family:"Lyon", Georgia, serif; font-size:40px; color:#111; font-weight:700;}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:28px}
        .board-wrap{background:transparent;padding:6px;border-radius:12px}
        .board-frame{background:#07121a;border-radius:12px;padding:14px;border:8px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.25)}
        #game{display:block;width:100%;height:auto;border-radius:8px;background:#07121a;}
    .underboard{display:flex;justify-content:space-between;align-items:center;padding:12px}
    .tip{color:var(--muted);font:12px/1.4 Arial, sans-serif}
    .restart{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;border:0}
    .side{display:grid;gap:14px}
    .panel { background: #fffdf8; border-radius: 12px; padding: 16px; color: #111; box-shadow: 0 6px 18px rgba(8,21,26,.06); border: 1px solid rgba(8,21,26,.04); }
        .panel h2 { color: #0b1a1f; margin-top: 0; }
        .controls { color: #0b1a1f; font: 11px/1.65 Arial, sans-serif; }
        .controls strong { color: #0b1a1f; }
        .player-row { color: #0b1a1f; }
        .player-percent { color: #0b1a1f; }
        .row-meta { color: rgba(11,26,31,.6); }
    .player-list{display:grid;gap:10px}
    .player-row{display:grid;grid-template-columns:28px 1fr 56px;gap:9px;align-items:center;font:700 12px Arial, sans-serif}
    .dot{width:24px;height:24px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
    .row-meta{color:var(--muted);font:11px;font-weight:400;margin-top:3px}
    .score-bar{height:12px;background:#eef6ee;border-radius:8px;margin-top:8px;overflow:hidden}
    .score-fill{height:100%;width:0%;transition:width 220ms linear}
    .player-percent{text-align:right;color:#0b1a1f;font-weight:700}
  </style>
  <style>
  #fullscreenExit{display:none;position:fixed;top:12px;right:12px;z-index:9999;background:#fff;color:#111;border-radius:6px;padding:8px 12px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  #fullscreenBtn{background:#18302c;color:#fff;border:0;padding:8px 12px;border-radius:4px;cursor:pointer}
  /* Fullscreen now targets the whole shell (board + side panel with QR/leaderboard/stats)
     instead of just the canvas, so joining, high scores and live stats stay visible. */
  #arenaRoot:fullscreen, #arenaRoot:-webkit-full-screen{width:100vw;height:100vh;max-width:none;padding:24px;box-sizing:border-box;background:linear-gradient(135deg,#f6f1e7,#e8f1ea 62%,#d4e6dc);overflow:auto;display:flex;flex-direction:column;justify-content:center}
  #arenaRoot:fullscreen .layout, #arenaRoot:-webkit-full-screen .layout{width:100%}
  </style>
  </head>
<body>
  <main class="shell" id="arenaRoot">
    <div class="layout">
      <div class="board-col">
        <header class="masthead">
          <div><div class="eyebrow">KLP JavaZone 2026</div><h1>Fiskekampen</h1><div class="eyebrow" style="margin-top:6px">Ta territorium</div></div>
        </header>
        <section class="board-wrap">
          <div class="board-frame"><canvas id="game" width="1120" height="672" aria-label="Fiskekampen game board"></canvas></div>
                  <div class="underboard">
                    <div style="display:inline-block;width:100%;text-align:right;vertical-align:top">
                      <div style="display:flex;justify-content:flex-end;gap:10px;align-items:center">
                        <button class="restart" id="restart">START RUNDE PÅ NYTT</button>
                        <button class="back" id="back">TILBAKE TIL LOBBY</button>
                        <button id="fullscreenBtn" class="restart">FULLSKJERM</button>
                      </div>
                    </div>
                  </div>
        </section>
      </div>
      <aside class="side">
        <section class="panel"><h2>Spillere</h2><div class="player-list" id="players"></div></section>
        <section class="panel" id="queuePanel" style="display:none"><h2>Venteliste</h2><div class="player-list" id="queueList"></div></section>
        <section class="panel"><h2>Toppliste</h2><div class="player-list" id="leaderboard"></div></section>
        <section class="panel" id="joinPanel" style="display:none;text-align:center"><h2>Bli med</h2><img id="qrImage" src="" alt="QR-kode for å bli med" style="width:180px;height:180px;border-radius:8px;background:#fff;padding:8px"><p class="row-meta" style="margin-top:8px">Skann for å ta over et bot-slot i en live 6-spiller match</p>
        </section>
      </aside>
    </div>
    <button id="fullscreenExit">Exit full screen</button>
  </main>
    <script src="/js/klp-arena-engine.js"></script>
</body>
</html>
