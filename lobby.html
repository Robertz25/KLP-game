<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLP Arena | Waiting Room</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8f1ea;color:#18302c;font-family:Georgia,serif}.card{width:min(620px,90%);padding:42px;background:#fffdf8;border-radius:9px;box-shadow:0 18px 45px #18302c22;text-align:center}.eyebrow{font:700 11px Arial;letter-spacing:.16em;color:#1f7a59}h1{font-size:52px;margin:10px}.room{background:#dcefe2;padding:20px;margin:24px 0}.room small{font:700 11px Arial;color:#1f7a59}#code{font:700 64px Arial;letter-spacing:.16em;margin:8px}.players{display:grid;gap:8px;margin:18px 0;text-align:left}.player{padding:12px;background:#f1f4ee;font:700 12px Arial}.button{width:100%;padding:15px;border:0;border-radius:4px;background:#18302c;color:#fff;font:700 13px Arial}.button:disabled{opacity:.4}</style></head><body><main class="card"><div class="eyebrow">KLP ARENA · LOCAL HOST</div><h1>Waiting room</h1><p>Scan the QR code to join.</p><div class="room"><small>ROOM CODE</small><div id="code">----</div></div><div class="players" id="players"><div class="player">Host · Connected</div></div><button class="button" id="start" disabled>Start arena</button></main><script>const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),code=document.querySelector('#code'),list=document.querySelector('#players'),start=document.querySelector('#start');ws.onopen=()=>ws.send(JSON.stringify({type:'create'}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='created')code.textContent=m.room;if(m.type==='players'){list.innerHTML='<div class="player">Host · Connected</div>'+m.players.map(p=>`<div class="player">${p.name} · Ready</div>`).join('');start.disabled=!m.players.length||m.started}};start.onclick=()=>{ws.send(JSON.stringify({type:'start'}));location.href='/klp_arena_poc.html?host=1'};</script></body></html>
