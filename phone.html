<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KLP Arena | Phone Controller</title><style>body{margin:0;min-height:100vh;touch-action:none;background:#e8f1ea;color:#18302c;font-family:Arial}.wrap{width:min(420px,90%);min-height:100vh;margin:auto;padding:24px 0;display:flex;flex-direction:column}.controller{display:none;flex:1;flex-direction:column;justify-content:space-between}.joystick{width:250px;height:250px;border-radius:50%;background:#c6dfcc;position:relative;margin:30px auto}.stick{width:35%;aspect-ratio:1;border-radius:50%;background:#1f7a59;position:absolute;left:32.5%;top:32.5%}.bomb{width:100%;padding:24px;background:#e86f51;color:#fff;border:0;border-radius:4px;font-size:22px}.contact{display:none;flex-direction:column;gap:10px}.contact input{padding:14px;border:1px solid #c9d7cc;border-radius:4px}.button{padding:14px;background:#18302c;color:#fff;border:0;border-radius:4px}.status{text-align:center;color:#60726d;min-height:20px}</style></head><body><main class="wrap"><h1>KLP Arena</h1><section id="controller" class="controller"><div class="status" id="status">Connecting...</div><input id="name" placeholder="Your name" maxlength="30"><button class="button" id="save">Save name</button><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div id="dead" class="status" style="display:none;font-size:28px;font-family:Georgia">You are out</div><form id="contact" class="contact"><input name="firstName" required placeholder="First name"><input name="lastName" required placeholder="Last name"><input name="email" required type="email" placeholder="Email"><input name="phone" required type="tel" placeholder="Phone number"><button class="button">Send details</button><button class="button" type="button" id="skip">Skip</button></form><div id="thanks" class="status" style="display:none;font-size:28px;font-family:Georgia">Thank you for playing</div><button class="bomb" id="bomb">DROP BOMB</button></section></main><script>(()=>{const room=new URLSearchParams(location.search).get('room'),socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),controller=document.querySelector('#controller'),status=document.querySelector('#status'),name=document.querySelector('#name'),save=document.querySelector('#save'),bomb=document.querySelector('#bomb'),joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick'),dead=document.querySelector('#dead'),contact=document.querySelector('#contact'),thanks=document.querySelector('#thanks');let active=false,vector={x:0,y:0};const send=(type,data={})=>{if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type,...data}))};const stop=()=>{active=false;vector={x:0,y:0};stick.style.transform='';send('input',{input:vector})};const move=e=>{e.preventDefault();const r=joystick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=r.width*.32,len=Math.min(max,Math.hypot(x,y)),a=Math.atan2(y,x);vector={x:Math.cos(a)*len/max,y:Math.sin(a)*len/max};stick.style.transform=`translate(${Math.cos(a)*len}px,${Math.sin(a)*len}px)`;send('input',{input:vector})};joystick.onpointerdown=e=>{active=true;joystick.setPointerCapture(e.pointerId);move(e)};joystick.onpointermove=e=>{if(active)move(e)};joystick.onpointerup=stop;joystick.onpointercancel=stop;window.onpointerup=stop;bomb.style.display='none';save.onclick=()=>send('rename',{name:name.value.trim()});bomb.onpointerdown=e=>{e.preventDefault();send('input',{input:{bomb:true}})};document.querySelector('#skip').onclick=()=>{contact.style.display='none';dead.textContent='Thanks for playing';dead.style.display='block'};contact.onsubmit=e=>{e.preventDefault();send('contact',{details:Object.fromEntries(new FormData(contact))});contact.style.display='none';dead.textContent='Thank you for playing';dead.style.display='block'};socket.onopen=()=>{if(room)send('join',{room:room.toUpperCase(),name:'Guest'});else status.textContent='No room code'};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){controller.style.display='flex';status.textContent='Waiting for host'}if(m.type==='start'){bomb.style.display='block';status.textContent='Game started'}if(m.type==='player-dead'){joystick.style.display='none';bomb.style.display='none';name.style.display='none';save.style.display='none';dead.style.display='block';contact.style.display='flex';status.textContent=''}if(m.type==='restart'){joystick.style.display='block';bomb.style.display='block';name.style.display='block';save.style.display='block';dead.style.display='none';contact.style.display='none';thanks.style.display='none';status.textContent='New round'}}})();</script></body></html>
